# --- example config file --- 
# copy this file, rename to 'config.yaml'
# update this file with your actual paths/info
# make sure to add the your config.yaml to gitignore!

PATHS:
  BASE_PATH: "/path/to/directoryForSagemicFiles"
  PATH_TO_CA_PEM: "/path/to/rootCA"
  PATH_TO_CRT: "/path/to/clientcrt"
  PATH_TO_KEY: "/path/to/clientkey"

SETTINGS:
  # Change  if outside of San Diego
  LATITUDE: 32.7157
  LONGITUDE: -117.1611
  LOCAL_TZ: "America/Los_Angeles"

  # Default for audio device
  SAMPLERATE: 48000
  CONFIDENCE_THRESHOLD: 0.1
  BLOCK_DURATION: 3

  # for audio_device, enter exact name from arecord-l in brackets
  # audiomoth: 48kHz AudioMoth USB Microphone
  # inmp441: snd_rpi_googlevoicehat_soundcar
  AUDIO_DEVICE: "exact_name_from_arecord-l"
  AUDIO_DTYPE: "int16_or_int32"

MQTT:
  # BROKER picks how clips are sent:
  #   SageMic (straight to the cloud broker): BROKER is the broker's address,
  #     PORT 8883, with the certificates in PATHS.
  #   SageMic Station with a SageMic hub: BROKER: hub, PORT: 1883, and the
  #     station login below (the certificates in PATHS are not used). The hub
  #     can then send software and model updates (UPDATE: KEY).
  # Default Port for MQTTS
  PORT: 8883
  # Usage: NodeRed assumes the first slash parses the base_topic and device name.
  # If a slash is used in base_topic, make sure to adjust the parsing on NodeRed 
  BASE_TOPIC: "topic_name"
  DEVICE: "device_name"
  BROKER: "<ip>"
  # SageMic hub only: the station login (the password from the hub's setup).
  # USERNAME: "sagemic-station"
  # PASSWORD: "<station MQTT password from the hub>"

# SageMic hub only: software and model updates sent from the hub's control page
# must be signed with this key (the update key from the hub's setup).
# Updates are refused while it is empty.
UPDATE:
  KEY: ""
