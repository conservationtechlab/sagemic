[general]
duration        = 0      # Stream indefinitely
bufferSecs      = 1      # Buffer for the input, in seconds
reconnect       = yes    # Reconnect to the server if disconnected

[input]
device          = hw:3,0 # Your audio capture device (e.g., 'hw:1,0' or 'default')
sampleRate      = 48000  # Sample rate in Hz
bitsPerSample   = 16     # Bits per sample
channel         = 1      # 2 = stereo, 1 = mono

[icecast2-0]
bitrateMode     = cbr    # Constant bit rate (cbr), variable (vbr) or average (abr)
format          = mp3    # Audio format: mp3/ogg
bitrate         = 128    # Bitrate in kbps
server          = FILLMEIN # Server name or IP (e.g., localhost if Icecast is on the same machine)
port            = 8000   # Port number, usually 8000
password        = FILLMEIN
mountPoint      = FILLMEIN # will be the / after the ip:port to call stream
name            = FILLMEIN # Stream name
description     = FILLMEIN
public          = no     # advertise this stream? yes/no
